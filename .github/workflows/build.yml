name: Build Input Buffer

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          python -c "import zipfile; zipfile.ZipFile('predictive-input-buffer-build-ready.zip').extractall('.')"

      - name: Compile Geode mod
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: latest
          path: predictive-input-buffer
          target: Android32

      - name: Upload compiled mod
        uses: actions/upload-artifact@v4
        with:
          name: Input-Buffer-Android32
          path: predictive-input-buffer/build/**/*.geode
          if-no-files-found: warn
