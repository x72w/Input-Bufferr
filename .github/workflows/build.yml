
name: Build Input Buffer

on:
  workflow_dispatch:
  push:
    branches: ["**"]

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - Android32
          - Android64

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          python -c "import zipfile; zipfile.ZipFile('predictive-input-buffer-build-ready.zip').extractall('.')"

      - name: Compile Geode mod
        uses: geode-sdk/build-geode-mod@main
        with:
          path: predictive-input-buffer
          target: ${{ matrix.target }}

      - name: Upload compiled files
        uses: actions/upload-artifact@v4
        with:
          name: Input-Buffer-${{ matrix.target }}
          path: |
            predictive-input-buffer/build/**/*.geode
            predictive-input-buffer/build/**/*.zip
          if-no-files-found: warn
          
